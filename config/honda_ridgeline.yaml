searches:
  honda_ridgeline:
    query: "honda ridgeline"
    categories: ["cta", "ctd"]
    cities: ["sfbay", "monterey", "sacramento"]
    max_pages: 3
    listing_type: "vehicle"

    storage:
      filename: "honda_ridgeline_listings.json"

    scoring:
      # ── 1st gen only (2006–2014) ──────────────────────────
      - keywords: ["2006", "2007", "2008", "2009", "2010", "2011", "2012", "2013", "2014"]
        points: 20
        match: title

      # Penalise 2nd gen (2017+) hard — different truck entirely
      - keywords: ["2017", "2018", "2019", "2020", "2021", "2022", "2023", "2024", "2025"]
        points: -50
        match: title

      # ── Low miles ─────────────────────────────────────────
      - keywords: ["low miles", "low mileage", "low mi"]
        points: 20

      - keywords: ["under 100k", "under 100,000", "90k", "80k", "70k", "60k", "50k"]
        points: 15

      - keywords: ["under 150k", "under 150,000", "140k", "130k", "120k", "110k"]
        points: 8

      # 200k+ is a hard boundary for the user
      - keywords: ["200k", "210k", "220k", "230k", "240k", "250k"]
        points: -30

      # ── Clean title ───────────────────────────────────────
      - keywords: ["clean title", "title in hand", "clear title"]
        points: 20
        match: title

      - keywords: ["clean title", "title in hand", "clear title"]
        points: 10
        match: description

      # ── Mechanical condition ──────────────────────────────
      - keywords: ["runs great", "runs excellent", "runs well", "drives great", "drives well"]
        points: 15

      - keywords: ["well maintained", "maintained", "serviced", "records", "service history",
                   "new tires", "new brakes", "recent service", "timing belt done"]
        points: 12

      - keywords: ["one owner", "1 owner", "single owner", "fleet", "carfax"]
        points: 10

      - keywords: ["garage kept", "garaged"]
        points: 8

      # ── Trim levels (RTL/RTS are higher trims) ────────────
      - keywords: ["rtl", "rts"]
        points: 8
        match: title
        match_type: whole

      # ── Red flags ─────────────────────────────────────────
      - keywords: ["salvage", "salvage title", "rebuilt title", "rebuilt"]
        points: -40
        match: title

      - keywords: ["flood", "flood damage", "water damage"]
        points: -40

      - keywords: ["needs work", "project", "parts car", "mechanic special", "as-is",
                   "fixer", "not running", "does not run", "wont start", "won't start"]
        points: -35

      - keywords: ["accident", "frame damage", "structural damage"]
        points: -30

      - keywords: ["dealer", "dealership", "financing available", "we finance",
                   "buy here pay here", "lot price"]
        points: -20

      - keywords: ["high miles", "high mileage"]
        points: -15

      - keywords: ["shipping", "will ship", "can ship", "nationwide"]
        points: -10

    price_rules:
      - above: 10000   # over budget — hard ceiling
        points: -60
      - below: 7000    # great deal, well under budget
        points: 25
      - below: 8500    # solid deal
        points: 12
      - no_price: true # unpriced listings are often overpriced or problematic
        points: -15

    deduplication:
      enabled: true
      similarity_threshold: 0.85
      min_title_length: 30
      max_age_days: 60
