searches:
  honda_ridgeline:
    query: "honda ridgeline"
    categories: ["cta"]           # cta = by owner only; drop ctd (dealers)
    cities: ["sfbay", "monterey", "sacramento", "losangeles", "sandiego",
             "portland", "seattle", "reno", "fresno", "stockton"]
    max_pages: 3
    listing_type: "vehicle"

    storage:
      filename: "honda_ridgeline_listings.json"

    scoring:
      # ── Must be a Ridgeline — anchor the whole search ───────────────────────
      - keywords: ["ridgeline", "rideline"]   # include common misspelling
        points: 40
        match: title

      # Hard penalise any Honda that isn't a Ridgeline (Odyssey, CR-V, etc.)
      - keywords: ["odyssey", "cr-v", "crv", "pilot", "accord", "civic", "element",
                   "passport", "hr-v", "hrv", "fit", "clarity", "insight", "prelude",
                   "del sol", "s2000", "crosstour", "ridgeline sport"]
        points: -100
        match: title
        excludes: ["ridgeline", "rideline"]

      # Generic body-style spam from dealers (Teslas, sedans, etc.) — not a truck
      - keywords: ["sedan", "coupe", "hatchback", "wagon", "convertible", "minivan",
                   "plug-in", "electric"]
        points: -60
        match: title
        match_type: whole
        excludes: ["ridgeline", "rideline"]

      # Penalise wrong vehicles showing up via keyword spam in title
      - keywords: ["bmw", "mazda", "toyota", "ford", "chevy", "chevrolet", "dodge",
                   "ram", "nissan", "gmc", "subaru", "acura", "lexus", "audi",
                   "volkswagen", "vw", "hyundai", "kia", "jeep", "mitsubishi",
                   "tacoma", "tundra", "ranger", "f-150", "f150", "silverado",
                   "colorado", "frontier", "titan", "highlander", "4runner",
                   "tesla", "volvo", "infiniti", "mercedes", "benz", "buick",
                   "cadillac", "lincoln", "pontiac", "saturn", "hummer", "jaguar",
                   "porsche", "mini", "fiat", "scion", "genesis", "chrysler",
                   "land rover", "range rover", "sienna", "sedona", "caravan",
                   "quest", "trailblazer", "yukon", "impala", "wrangler", "focus"]
        points: -60
        match: title
        match_type: whole

      # ── 1st gen only (2006–2014) ─────────────────────────────────────────────
      - keywords: ["2006", "2007", "2008", "2009", "2010", "2011", "2012", "2013", "2014"]
        points: 20
        match: title

      # Hard penalise 2nd gen (2017+) — completely different truck
      - keywords: ["2017", "2018", "2019", "2020", "2021", "2022", "2023", "2024", "2025"]
        points: -50
        match: title

      # ── Low miles (≤150k preferred) ──────────────────────────────────────────
      - keywords: ["low miles", "low mileage", "low mi"]
        points: 20

      - keywords: ["under 100k", "under 100,000", "90k", "80k", "70k", "60k", "50k"]
        points: 15

      - keywords: ["under 150k", "under 150,000", "140k", "130k", "120k", "110k"]
        points: 8

      # Mild penalty for 150k–200k range (user prefers ≤150k)
      - keywords: ["160k", "170k", "180k", "190k"]
        points: -10

      # Hard penalty above 200k
      - keywords: ["200k", "210k", "220k", "230k", "240k", "250k"]
        points: -30

      # ── Clean title ──────────────────────────────────────────────────────────
      - keywords: ["clean title", "title in hand", "clear title"]
        points: 20
        match: title

      - keywords: ["clean title", "title in hand", "clear title"]
        points: 10
        match: description

      # ── One owner ────────────────────────────────────────────────────────────
      - keywords: ["one owner", "1 owner", "single owner", "1-owner", "only owner"]
        points: 15

      # ── Dealer serviced / service records (love this) ─────────────────────────
      - keywords: ["dealer serviced", "dealer maintained", "honda dealer", "honda service",
                   "dealership service", "dealership maintained", "honda certified",
                   "service records", "service history", "full service history",
                   "maintenance records", "all records", "carfax"]
        points: 15

      - keywords: ["well maintained", "maintained", "serviced", "records",
                   "new tires", "new brakes", "recent service", "timing belt done",
                   "timing belt replaced"]
        points: 8

      - keywords: ["runs great", "runs excellent", "runs well", "drives great", "drives well"]
        points: 10

      - keywords: ["garage kept", "garaged"]
        points: 8

      # ── OEM / unmodified / stock (love this) ──────────────────────────────────
      - keywords: ["stock", "oem", "original", "unmodified", "factory"]
        points: 12
        match: description
        match_type: whole

      - keywords: ["never modified", "all original", "bone stock", "completely stock"]
        points: 15

      # ── Cosmetic imperfections are fine for a truck — don't penalise these ───
      # (no negative rules for minor dents, scratches, paint issues)

      # ── Trim levels (RTL/RTS are higher trims) ───────────────────────────────
      - keywords: ["rtl", "rts"]
        points: 8
        match: title
        match_type: whole

      # ── Red flags ─────────────────────────────────────────────────────────────
      - keywords: ["salvage", "salvage title", "rebuilt title", "rebuilt"]
        points: -50
        match: title

      - keywords: ["flood", "flood damage", "water damage"]
        points: -50

      - keywords: ["needs work", "project", "parts car", "mechanic special", "as-is",
                   "fixer", "not running", "does not run", "wont start", "won't start"]
        points: -35

      - keywords: ["accident", "frame damage", "structural damage"]
        points: -30

      - keywords: ["high miles", "high mileage"]
        points: -15

      - keywords: ["modified", "lift kit", "leveling kit", "aftermarket", "custom wheels",
                   "lowered", "suspension upgrade"]
        points: -10

      - keywords: ["shipping", "will ship", "can ship", "nationwide"]
        points: -10

      # ── Location: strongly derank out-of-state ─────────────────────────────
      # Not a hard filter, but only genuinely great listings will overcome this
      - keywords: ["portland", "seattle", "reno"]   # OR / WA / NV
        points: -60
        match: city

      # Mild derank for far SoCal (still CA, but a long haul)
      - keywords: ["sandiego"]
        points: -10
        match: city

    price_rules:
      - above: 10000   # Over the user's budget ceiling
        points: -60
      - below: 6000    # Great deal
        points: 30
      - below: 7500    # Solid deal
        points: 15
      - below: 9000    # Reasonable
        points: 5
      - no_price: true # Unpriced listings are often problematic
        points: -15

    notifications:
      enabled: true
      min_score: 60
      max_listings: 20

    deduplication:
      enabled: true
      similarity_threshold: 0.85
      min_title_length: 30
      max_age_days: 60
