searches:
  subaru_forester:
    query: "subaru forester"
    categories: ["cta"]
    cities: ["sfbay", "losangeles", "sacramento", "sandiego", "portland",
             "seattle", "reno", "fresno", "stockton", "monterey"]
    max_pages: 3
    listing_type: "vehicle"  # Specifies this is a vehicle search
    
    storage:
      filename: "subaru_forester_listings.json"
    
    scoring:
      # ── Must be a Forester — anchor the whole search ───────────────────────
      - keywords: ["forester"]
        points: 40
        match: title
        match_type: whole

      # Penalise wrong vehicles showing up via keyword spam in title
      - keywords: ["bmw", "mazda", "toyota", "ford", "chevy", "chevrolet", "dodge",
                   "ram", "nissan", "gmc", "honda", "acura", "lexus", "audi",
                   "volkswagen", "vw", "hyundai", "kia", "jeep", "mitsubishi",
                   "outback", "impreza", "legacy", "crosstrek", "wrx", "brz"]
        points: -60
        match: title
        match_type: whole

      # ── Manual transmission (top priority) ────────────────────────────
      - keywords: ["manual", "5-speed", "5 speed", "6-speed", "6 speed", "standard transmission"]
        points: 25
        match: title
        match_type: whole
      
      - keywords: ["xt"]
        points: 10
        match: title
        match_type: whole  # Only whole word "xt" not "ext" or "text"
      
      - keywords: ["first gen", "sf5", "1998", "1999", "2000", "2001", "2002", "2003", "2004"]
        points: 20

      # Penalise newer gens — user wants early Foresters only
      - keywords: ["2015", "2016", "2017", "2018", "2019", "2020", "2021", "2022", "2023", "2024", "2025"]
        points: -40
        match: title
      
      - keywords: ["low miles", "low mileage", "under 100k", "under 80k", "under 60k"]
        points: 15
        match: description
      
      - keywords: ["clean title", "title in hand"]
        points: 10
        match: title
      
      - keywords: ["rust free", "no rust", "garage kept", "one owner", "1-owner", "1 owner"]
        points: 8
      
      - keywords: ["awd", "all wheel drive", "4x4", "4wd"]
        points: 5
      
      - keywords: ["automatic", "auto", "cvt", "cvt transmission"]
        points: -10
        match: title
      
      - keywords: ["2.5t", "wrx engine swap"]
        points: -15
      
      - keywords: ["salvage", "salvage title", "rebuilt title", "flood damage"]
        points: -25
        match: title
      
      - keywords: ["dealer", "dealership", "lot", "financing available"]
        points: -20
      
      - keywords: ["needs work", "project", "parts car", "mechanic special"]
        points: -15
      
      # Example: turbo points only if NOT a WRX (excludes)
      - keywords: ["turbo"]
        points: 5
        excludes: ["wrx", " STI", "sti"]
      
      # Example: only apply points if certain condition met (requires)
      - keywords: ["wrap"]
        points: 15
        requires: ["canvas", "vinyl"]  # wrapped vehicle must have mention of wrap material

      - keywords: ["we rebuild subaru engines"]
        points: -100
        match: title

    price_rules:
      - above: 10000   # Over budget ceiling
        points: -60
      - below: 5000    # Great deal
        points: 30
      - below: 7000    # Solid deal
        points: 15
      - below: 9000    # Reasonable
        points: 5
      - no_price: true # Unpriced listings are often problematic
        points: -15

    deduplication:
      enabled: true
      similarity_threshold: 0.85  # 0.0-1.0, higher = stricter
      min_title_length: 30  # titles shorter than this won't be compared
      max_age_days: 90  # listings older than this are removed
    
    notifications:
      enabled: true
      min_score: 60  # Only notify for listings scoring above this threshold
      max_listings: 20  # Maximum listings to include in email
